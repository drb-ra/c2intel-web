<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="C2 Intel Feeds">
  <defs>
    <style>
      .logo-text-main { fill: #1a1d23; }
      .logo-text-sub  { fill: #457b9d; }
      @media (prefers-color-scheme: dark) {
        .logo-text-main { fill: #e6edf3; }
        .logo-text-sub  { fill: #79c0ff; }
      }
    </style>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(4, 4)">
    <!-- Shield background -->
    <path d="M26 0 L52 10 L52 30 C52 44 26 52 26 52 C26 52 0 44 0 30 L0 10 Z"
          fill="#e63946" />
    <!-- Shield highlight (top) -->
    <path d="M26 3 L49 12 L49 30 C49 42 26 49 26 49 C26 49 3 42 3 30 L3 12 Z"
          fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <!-- Layers icon inside shield (white) -->
    <path d="M26 16 L14 22 L26 28 L38 22 Z" fill="white" opacity="0.95"/>
    <path d="M14 27 L26 33 L38 27" fill="none" stroke="white" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M14 32 L26 38 L38 32" fill="none" stroke="white" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  </g>

  <!-- Site name text -->
  <text x="68" y="26"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="18" font-weight="700" letter-spacing="-0.3"
        class="logo-text-main">C2 Intel</text>
  <text x="68" y="46"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="500" letter-spacing="1.5"
        class="logo-text-sub">FEEDS</text>
</svg>
